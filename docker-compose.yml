version: '3.8'
services:
  api:
    build: .
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
    environment:
      - FOODID_DB=/data/foodid.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped
  ui:
    build: .
    command: ["python", "ui.py"]
    ports:
      - "7860:7860"
    environment:
      - FOODID_API=http://api:5000
    depends_on:
      - api
    restart: unless-stopped
