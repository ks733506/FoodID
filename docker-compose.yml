version: '3.8'

services:
  api:
    build: .
    container_name: foodid_api
    ports:
      - "5000:5000"
    volumes:
      - foodid_data:/data
    environment:
      - FOODID_DB=/data/foodid.db
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:5000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  ui:
    build: .
    container_name: foodid_ui
    command: ["python", "ui.py"]
    ports:
      - "7860:7860"
    environment:
      - FOODID_API=http://api:5000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  foodid_data:
    driver: local
